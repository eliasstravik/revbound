# Build, unit and check-rule tests, the ledger and mdm on real Postgres (a service container started before the firewall),
# `npm pack`, then the acceptance suite against that tarball inside a firewall that allows only the npm registry. No
# publish steps.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Typecheck, unit tests and every revbound check rule
        run: npm run check

      - name: The ledger and mdm on Postgres 16 and on PGlite
        env:
          GTM_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test test/ledger/*.test.mjs test/mdm/*.test.mjs

      - name: Line budgets
        run: npm run lines

      - name: Pack
        run: |
          mkdir -p /tmp/gtm-ci
          npm pack --pack-destination /tmp/gtm-ci
          ls -l /tmp/gtm-ci

      # The checks run inside a network sandbox that allows only the npm registry. The runner itself must keep
      # talking to GitHub, so the tests run as a separate user whose outbound traffic is limited to loopback (the app,
      # PGlite, systemd-resolved's stub resolver), the configured DNS servers and HTTPS to registry.npmjs.org's
      # addresses. It is address-based: those are shared CDN addresses, so this catches calls to any other service
      # (Vercel, Neon, model providers, telemetry) but is not a hostname filter.
      - name: Network sandbox for the test user (npm registry only)
        run: |
          sudo useradd --create-home gtmtest
          uid=$(id -u gtmtest)
          sudo iptables -N GTMTEST
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$uid" -j GTMTEST
          sudo iptables -A GTMTEST -o lo -j ACCEPT
          for ns in $(awk '/^nameserver/ {print $2}' /etc/resolv.conf | grep -v ':'); do
            sudo iptables -A GTMTEST -d "$ns" -p udp --dport 53 -j ACCEPT
            sudo iptables -A GTMTEST -d "$ns" -p tcp --dport 53 -j ACCEPT
          done
          for i in 1 2 3; do getent ahostsv4 registry.npmjs.org | awk '{print $1}'; done | sort -u > /tmp/gtm-ci/registry-ips
          while read -r ip; do sudo iptables -A GTMTEST -d "$ip" -p tcp --dport 443 -j ACCEPT; done < /tmp/gtm-ci/registry-ips
          sudo iptables -A GTMTEST -j REJECT
          sudo ip6tables -N GTMTEST
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$uid" -j GTMTEST
          sudo ip6tables -A GTMTEST -o lo -j ACCEPT
          sudo ip6tables -A GTMTEST -j REJECT
          # The test user reads the checkout (test/, node_modules/) and writes only under /tmp.
          d="$GITHUB_WORKSPACE"; while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          sudo -u gtmtest curl -fsS -o /dev/null --max-time 20 https://registry.npmjs.org/ && echo "registry: reachable"
          if sudo -u gtmtest curl -sS -o /dev/null --max-time 10 https://api.vercel.com/; then echo "sandbox is open" && exit 1; fi
          echo "other hosts: blocked"

      - name: Acceptance against the tarball
        run: |
          sudo -u gtmtest -H env "PATH=$PATH" "GTM_TEST_TARBALL=$(ls /tmp/gtm-ci/*.tgz)" \
            GTM_TEST_DIR=/tmp/gtm-work GTM_TEST_LOGS=/tmp/gtm-logs \
            node --test --test-reporter=spec test/acceptance.test.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-logs
          path: /tmp/gtm-logs
